# Spring Boot Application Configuration
spring.application.name=sample-spring-boot-app
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Application Info
info.app.name=Sample Spring Boot Application
info.app.description=A sample Spring Boot application for testing documentation conversion
info.app.version=1.0.0

# Logging
logging.level.com.nymph.converter.example=DEBUG
logging.level.org.springframework.web=INFO